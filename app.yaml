command: ['python', '-m', 'server.run']
env:
  - name: ATLAS_AUTH_MODE
    value: databricks-app
  - name: ATLAS_HISTORY_BACKEND
    value: lakebase
  - name: DATABRICKS_GENIE_AGENT_ID
    value: REPLACE_WITH_TARGET_GENIE_AGENT_ID
  - name: DATABRICKS_PROJECT_INDEX
    value: REPLACE_WITH_TARGET_CATALOG_SCHEMA_INDEX
  - name: DATABRICKS_AGENT_MODEL
    value: REPLACE_WITH_TARGET_AI_GATEWAY_MODEL
  - name: DATABRICKS_RAG_ENDPOINT
    value: REPLACE_WITH_TARGET_CHAT_SERVING_ENDPOINT
  - name: LAKEBASE_ENDPOINT
    value: projects/REPLACE_WITH_PROJECT/branches/REPLACE_WITH_BRANCH/endpoints/REPLACE_WITH_ENDPOINT
