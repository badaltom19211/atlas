command: ['python', '-m', 'server.run']
env:
  - name: ATLAS_AUTH_MODE
    value: databricks-app
  - name: ATLAS_HISTORY_BACKEND
    value: lakebase
  - name: DATABRICKS_GENIE_AGENT_ID
    value: REPLACE_WITH_TARGET_GENIE_AGENT_ID
  - name: DATABRICKS_CONTRACT_INDEX
    value: REPLACE_WITH_TARGET_CATALOG_SCHEMA_INDEX
  - name: DATABRICKS_MODEL_API
    value: gateway
  - name: DATABRICKS_AGENT_MODEL
    value: system.ai.meta-llama-3-3-70b-instruct
  - name: DATABRICKS_EMBEDDING_MODEL
    value: system.ai.gte-large-en
  - name: ATLAS_RAG_TOP_K
    value: '20'
  # Optional: fetch shared glossary files at startup using the app service principal.
  # Set this to your existing workspace folder; do not enable both glossary settings.
  # - name: ATLAS_GLOSSARY_WORKSPACE_DIR
  #   value: /Workspace/Shared/business_glossary
  # Alternative: a folder already packaged with the app deployment.
  # - name: ATLAS_GLOSSARY_DIR
  #   value: app_assets/business_glossary
  - name: LAKEBASE_ENDPOINT
    value: projects/REPLACE_WITH_PROJECT/branches/REPLACE_WITH_BRANCH/endpoints/REPLACE_WITH_ENDPOINT
